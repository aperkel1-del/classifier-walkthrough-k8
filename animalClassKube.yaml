apiVersion: batch/v1
kind: Job
metadata:
  name: animal-training
  namespace: user-aperkel1
spec:
  template:
    spec:
      restartPolicy: OnFailure 
      runtimeClassName: habana #gives access to HPUs
      volumes:
        - name: dshm #volume allocates memory for more workers during training
          emptyDir:
            medium: Memory
            sizeLimit: 4Gi
      containers:
        - name: animal-trainer
          volumeMounts:
           - mountPath: /dev/shm
             name: dshm
          image: 'vault.habana.ai/gaudi-docker/1.24.0/ubuntu24.04/habanalabs/pytorch-installer-2.10.0' #pulls image from intel
          command: ["/bin/sh", "-c"]
          args: 
            - >-
              apt-get update && apt-get install -y git unzip &&
              pip install kaggle &&
              git clone https://github.com/aperkel1-del/classifier-walkthrough-k8.git /workspace &&
              kaggle datasets download likhon148/animal-data -p /data &&
              unzip /data/animal-data.zip -d /data &&
                python /workspace/animalClassifierK8.py
              sleep 1800
          env:
            - name: HABANA_LOGS #directory where Habana runtime/profiling logs get written inside the container
              value: "/workspace/habana_logs"
            - name: PT_HPU_LAZY_MODE # enables lazy execution mode on HPU (vs eager)
              value: "1"
            - name: KAGGLE_USERNAME #kaggle credentials to pull dataset
              valueFrom:
                secretKeyRef:
                  name: kaggle-credentials
                  key: KAGGLE_USERNAME
            - name: KAGGLE_KEY
              valueFrom:
                secretKeyRef:
                  name: kaggle-credentials
                  key: KAGGLE_KEY
          resources: #define hardware allocation
            limits:
              habana.ai/gaudi: "1"
              memory: "32Gi"
              cpu: "8"
            requests:
              habana.ai/gaudi: "1"
              memory: "32Gi"
              cpu: "8"




             
